name: Build H264 Cam Raspberry Pi OS image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-image.yml"
      - "build-image.sh"
      - "install.sh"
      - "requirements.apt"
      - "requirements.txt"
      - "petcam"
      - "src/**"
      - "tests/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h264-cam-image-main
  cancel-in-progress: true

jobs:
  build-image:
    name: Build H264 Cam Raspberry Pi OS Trixie (ARMHF)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run Python unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Install host tools and QEMU ARMHF emulation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static \
            curl \
            xz-utils \
            parted \
            e2fsprogs \
            util-linux

          test -x /usr/bin/qemu-arm-static
          /usr/bin/qemu-arm-static --version
          echo "QEMU ARM user-mode emulation is available on this runner."

      - name: Build image
        env:
          PETCAM_VERSION: trixie-${{ github.sha }}
          PETCAM_SOURCE_COMMIT: ${{ github.sha }}
          PETCAM_SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PETCAM_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::PETCAM_SOURCE_COMMIT must be a full 40-character commit SHA."
            exit 1
          }
          sudo env \
            PETCAM_VERSION="$PETCAM_VERSION" \
            PETCAM_SOURCE_COMMIT="$PETCAM_SOURCE_COMMIT" \
            PETCAM_SOURCE_REF="$PETCAM_SOURCE_REF" \
            ./build-image.sh "$RUNNER_TEMP/petcam-image"

      - name: Verify image archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          image_file="$(find "$RUNNER_TEMP/petcam-image" -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          test -n "$image_file"
          test -s "$image_file.sha256"
          (cd "$(dirname "$image_file")" && sha256sum --check "$(basename "$image_file").sha256")
          xz --test "$image_file"

      - name: Upload compressed Raspberry Pi OS image and checksum
        uses: actions/upload-artifact@v6
        with:
          name: h264-cam-trixie-armhf-image
          path: ${{ runner.temp }}/petcam-image/*.img.xz*
          if-no-files-found: error
          retention-days: 14
