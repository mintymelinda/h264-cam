name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and Live555 native build
    runs-on: ubuntu-24.04
    container: debian:sid
    timeout-minutes: 15

    steps:
      - name: Install Git and Live555 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            python3 \
            g++ \
            liblivemedia-dev \
            libopus-dev \

      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: bash -n install.sh build-image.sh release.sh

      - name: Compile Python source
        run: python3 -m compileall -q src tests create-imager-manifest.py

      - name: Run Python unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
