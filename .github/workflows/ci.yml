name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and GStreamer RTSP runtime
    runs-on: ubuntu-24.04
    container: debian:sid
    timeout-minutes: 15

    steps:
      - name: Install Git and GStreamer runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            python3 \
            python3-gi \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: bash -n install.sh build-image.sh release.sh scripts/install-gstreamer-runtime.sh

      - name: Install the minimal GStreamer RTSP and H.264 runtime
        run: bash scripts/install-gstreamer-runtime.sh

      - name: Compile Python source
        run: python3 -m compileall -q src tests create-imager-manifest.py

      - name: Run Python unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Validate the GStreamer RTSP runtime
        env:
          PYTHONPATH: src
        run: |
          python3 -c 'from petcam.infrastructure.streaming.gstreamer import validate_runtime; validate_runtime()'

      - name: Test the installed foreground launcher
        run: |
          install -d -m 0755 /opt/petcam/src /usr/local/bin
          cp -a src/petcam /opt/petcam/src/
          install -m 0755 petcam /usr/local/bin/petcam
          python3 scripts/smoke-test-installed-launcher.py
